[build]
  command = "cd client && pnpm install && pnpm build && node ../scripts/gerar-catalogos.mjs"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"

# Endereços antigos usados no Instagram
[[redirects]]
  from = "/natal"
  to = "/loja/natal"
  status = 301

[[redirects]]
  from = "/encomendar"
  to = "/pedido"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "production" }

[context.branch-deploy]
  environment = { NODE_ENV = "production" }
